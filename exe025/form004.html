<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormulárioDocument</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadstro.php" method="get">
         <label for="iemail" >E-mail</E-mail>
         <input type="email" name="email" id="iemail" autocomplete="email" required>

         <p>
            <label for="itel">Telefone</label>
            <input type="tel" name="tel" id="itel" autocomplete="tel" pattern="^\(\d{2}\)\d{4,5}-\d{4}$" required>
         </p>

         <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
             </p>
    </form>
    
</body>
</html>
